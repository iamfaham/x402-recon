name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run the test suite
        run: uv run pytest -q

  build:
    name: Package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Check the built artifacts exist
        run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    # Only a published GitHub Release triggers a publish attempt — a plain
    # push or PR never reaches this job.
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: PyPI verifies this OIDC token against the
      # publisher registered at pypi.org/manage/project/x402-recon/settings/publishing/
      # (repo + workflow filename must match; no API token needed or stored).
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

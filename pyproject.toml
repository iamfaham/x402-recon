[project]
name = "x402-recon"
version = "0.3.0"
description = "Reconciliation and customer analytics for x402 agent stablecoin payments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
x402-recon = "x402_recon.cli:run"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x402_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "agent-payment-reconciliation"
version = "0.1.0"
description = "Ledger — reconciliation and reporting for agent stablecoin payments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ledger = "ledger.cli:run"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
